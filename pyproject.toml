[project]
name = "campus-rag"
version = "0.1.0"
description = "Retrieval-augmented generation service that answers questions about public university documents with cited sources."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "beautifulsoup4>=4.12",
    "httpx>=0.27",
    "lxml>=5.2",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
    "tiktoken>=0.7",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[build-system]
# uv builds this backend itself without downloading it, so rebuilds work on networks that block
# PyPI's file host. Raise the range when moving to a new uv minor version (decision 8b).
requires = ["uv_build>=0.13.0,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "db: requires the local PostgreSQL database (start with scripts/setup-local-environment.ps1)",
]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
