[project]
name = "campus-rag"
version = "0.1.0"
description = "Retrieval-augmented generation service that answers questions about public university documents with cited sources."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/campus_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "db: requires the local PostgreSQL database (start with scripts/setup-local-environment.ps1)",
]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
