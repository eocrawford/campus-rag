# Local development services: PostgreSQL 17 with pgvector, and Ollama for embeddings.
# Values come from .env (see .env.example); defaults match .env.example.
name: campus-rag

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${CAMPUS_RAG_DB_USER:-campus_rag}
      POSTGRES_PASSWORD: ${CAMPUS_RAG_DB_PASSWORD:-campus_rag_local}
      POSTGRES_DB: ${CAMPUS_RAG_DB_NAME:-campus_rag}
    ports:
      # Bound to loopback only; 5433 avoids conflicts with a locally installed PostgreSQL.
      - "127.0.0.1:${CAMPUS_RAG_DB_PORT:-5433}:5432"
    volumes:
      - campus-rag-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  ollama:
    # Embedding model server (CPU only). Pinned so every machine runs the same server version.
    image: ollama/ollama:0.40.14
    ports:
      # Bound to loopback only.
      - "127.0.0.1:${CAMPUS_RAG_OLLAMA_PORT:-11434}:11434"
    volumes:
      # Pulled models persist here; -ResetDatabase leaves this volume in place.
      - campus-rag-ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  campus-rag-db:
  campus-rag-ollama:
